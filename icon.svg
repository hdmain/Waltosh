<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .crypto-geo {
        fill: none;
        stroke: #000000;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 6px;
      }
    </style>
  </defs>

  <!-- Zewnętrzny Heksagon -->
  <polygon class="crypto-geo" points="200,40 338.56,120 338.56,280 200,360 61.44,280 61.44,120"/>

  <!-- Duża Zewnętrzna Gwiazda Dawida (2 główne trójkąty) -->
  <polygon class="crypto-geo" points="200,40 338.56,280 61.44,280"/>
  <polygon class="crypto-geo" points="200,360 61.44,120 338.56,120"/>

  <!-- 3 Główne Osie Symetrii (Przekątne przechodzące przez środek) -->
  <line class="crypto-geo" x1="200" y1="40" x2="200" y2="360"/>
  <line class="crypto-geo" x1="61.44" y1="120" x2="338.56" y2="280"/>
  <line class="crypto-geo" x1="61.44" y1="280" x2="338.56" y2="120"/>

  <!-- Wewnętrzny Heksagon (Obrys centralnej kostki) -->
  <polygon class="crypto-geo" points="200,120 269.28,160 269.28,240 200,280 130.72,240 130.72,160"/>

  <!-- Mała Wewnętrzna Gwiazda Dawida (Tworząca strukturę 3D/tesseraktu) -->
  <polygon class="crypto-geo" points="200,120 269.28,240 130.72,240"/>
  <polygon class="crypto-geo" points="200,280 130.72,160 269.28,160"/>
</svg>
