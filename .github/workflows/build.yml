name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_release: ${{ steps.ver.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
            echo "version=${ver}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            cmake_ver="$(sed -n 's/^project(Waltosh VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -n1)"
            short="${GITHUB_SHA::7}"
            echo "version=${cmake_ver}-${short}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows + installer
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-tools
            git

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/ucrt64

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy Qt + MinGW runtime
        run: |
          pacman -S --noconfirm mingw-w64-ucrt-x86_64-ntldd || true
          bash scripts/deploy-windows.sh build/Waltosh.exe dist/windows
          test -f dist/windows/Waltosh.exe
          test -f dist/windows/Qt6Core.dll
          test -f dist/windows/zlib1.dll || test -f dist/windows/libz.dll || \
            (echo "missing zlib dependency" >&2; ls -lah dist/windows; exit 1)
          ls -lah dist/windows

      - name: Zip portable build
        shell: pwsh
        run: |
          $ver = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist/portable | Out-Null
          Compress-Archive -Path dist/windows/* -DestinationPath "dist/portable/Waltosh-$ver-windows-x64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $ver = "${{ needs.version.outputs.version }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          New-Item -ItemType Directory -Force -Path dist/installer | Out-Null
          $src = (Resolve-Path dist/windows).Path
          $out = (Resolve-Path dist/installer).Path
          & $iscc `
            /DMyAppVersion=$ver `
            "/DSourceDir=$src" `
            "/DOutputDir=$out" `
            packaging\windows\waltosh.iss
          Get-ChildItem dist/installer | Format-Table Name, Length

      - name: Upload Windows portable zip
        uses: actions/upload-artifact@v4
        with:
          name: Waltosh-windows-x64-portable
          path: dist/portable/*.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Waltosh-windows-x64-setup
          path: dist/installer/*.exe
          if-no-files-found: error

  linux:
    name: Linux + deb
    needs: version
    # Ubuntu 22.04: older glibc + classic libqt6* package names so the .deb
    # installs on 22.04 and on 24.04 (t64 packages Provide the classic names).
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            libqt6svg6-dev \
            qt6-multimedia-dev \
            git \
            libx11-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            wayland-protocols \
            dpkg-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Install into staging prefix
        run: |
          cmake --install build --prefix "${{ github.workspace }}/dist/linux"
          mkdir -p dist/linux-bin
          cp -a dist/linux/bin/Waltosh dist/linux-bin/
          ver="${{ needs.version.outputs.version }}"
          mkdir -p dist/linux-portable
          cp -a dist/linux/bin/Waltosh "dist/linux-portable/Waltosh-${ver}-linux-x64"
          chmod +x "dist/linux-portable/Waltosh-${ver}-linux-x64"

      - name: Package .deb
        working-directory: build
        run: |
          cpack -G DEB
          mkdir -p "${{ github.workspace }}/dist/deb"
          cp -a *.deb "${{ github.workspace }}/dist/deb/"
          # Sanity-check: must not require Ubuntu 24.04-only t64 package names alone.
          dpkg-deb -f *.deb Depends | tee /tmp/waltosh-depends.txt
          if grep -E 'libqt6[a-z0-9]+t64' /tmp/waltosh-depends.txt | grep -v '|'; then
            echo "ERROR: Depends pins t64-only Qt packages (breaks older distros)" >&2
            cat /tmp/waltosh-depends.txt >&2
            exit 1
          fi
          ls -lah "${{ github.workspace }}/dist/deb"

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: Waltosh-linux-x64
          path: dist/linux-portable/*
          if-no-files-found: error

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: Waltosh-linux-deb
          path: dist/deb/*.deb
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [version, windows, linux]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.deb' -o -name 'Waltosh-*' \) -print
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.deb' \) -exec cp -a {} release-assets/ \;
          # Named Linux binary without extension
          find artifacts/Waltosh-linux-x64 -type f -exec cp -a {} release-assets/ \;
          ls -lah release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="$(printf '%s\n' \
            "## WALTOSH ${VERSION}" \
            "" \
            "### Windows" \
            "- \`Waltosh-${VERSION}-windows-x64-setup.exe\` — Inno Setup installer" \
            "- \`Waltosh-${VERSION}-windows-x64.zip\` — portable (no install)" \
            "" \
            "### Linux" \
            "- \`*.deb\` — Debian/Ubuntu package (Qt 6.2+)" \
            "- \`Waltosh-${VERSION}-linux-x64\` — standalone binary (needs system Qt6)" \
          )"
          gh release create "$tag" \
            --title "WALTOSH ${VERSION}" \
            --notes "$notes" \
            release-assets/*
